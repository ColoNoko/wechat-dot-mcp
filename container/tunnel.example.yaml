{
  "config_version": 1,
  "control_plane": {
    "base_url": "https://api.openai.com",
    "tunnel_id": "REPLACE_WITH_YOUR_TUNNEL_ID",
    "api_key": "file:/run/secrets/tunnel-runtime-key"
  },
  "health": {"listen_addr": "127.0.0.1:0", "url_file": "/state/health.url"},
  "admin_ui": {"open_browser": false},
  "log": {"level": "warn", "format": "json", "file": "/dev/null"},
  "mcp": {"commands": [{"channel": "main", "command": "/usr/local/bin/wechat-dot-bridge --config /config/bridge.json serve"}]}
}
