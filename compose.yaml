name: wechat-dot-bridge
services:
  bridge:
    image: wechat-dot-bridge:67c726e-tunnel0.0.16-amd64
    platform: linux/amd64
    pull_policy: never
    user: "${PUID:?Set PUID to your existing non-root NAS user}:${PGID:?Set PGID}"
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 45s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    cpus: 1.0
    mem_limit: 768m
    memswap_limit: 768m
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    volumes:
      - type: bind
        source: ${WDB_ROOT:?Set WDB_ROOT to your absolute deployment directory}/config
        target: /config
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${WDB_ROOT:?Set WDB_ROOT to your absolute deployment directory}/state
        target: /state
        bind: {create_host_path: false}
      - type: bind
        source: ${WDB_ROOT:?Set WDB_ROOT to your absolute deployment directory}/secrets
        target: /run/secrets
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, python, /opt/container/entrypoint.py, check]
      start_period: 60s
      interval: 60s
      timeout: 15s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: "2"}
